[project]
name = "datainsightagent"
version = "0.1.0"
description = "A data insight agent that interacts with users using natural language to complete data science analysis and achieve data-driven decision-making."
authors = [
    {name = "ZhixinChang",email = "1070989486@qq.com"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.13,<4.0.0"
dependencies = [
    "langchain (>=1.2.10,<2.0.0)",
    "langgraph (>=1.0.8,<2.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "logging (>=0.4.9.6,<0.5.0.0)",
    "pandas (>=3.0.0,<4.0.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "fastapi (>=0.129.0,<0.130.0)",
    "matplotlib (>=3.10.8,<4.0.0)",
    "optbinning (>=0.21.0,<0.22.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
